openapi: 3.0.3
info:
  title: AISHA API
  version: 0.2.0
  description: AISHA authentication, authorization, and platform health API
servers:
  - url: /
security: []
paths:
  /api/v1/auth/register:
    post:
      summary: Register a customer account
      operationId: register
      x-casbin-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Account created
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      operationId: login
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200':
          description: Authentication succeeded
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh session
      operationId: refresh
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '200':
          description: Session rotated
          content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh session
      operationId: logout
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '204': {description: Session revoked}
        '400': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset without disclosing account existence
      operationId: forgotPassword
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}}}
      responses:
        '202': {description: Request accepted}
        '400': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/reset-password:
    post:
      summary: Reset a password with a single-use token
      operationId: resetPassword
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}
      responses:
        '204': {description: Password reset and existing sessions revoked}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      summary: Return the authenticated combined account
      operationId: me
      description: Requires an active authenticated session and the Casbin `/api/v1/me:read` permission.
      x-casbin-permission: /api/v1/me:read
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current user
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/profile:
    get:
      summary: Get the authenticated customer profile
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/me:read
      responses: {'200': {description: Customer profile, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerProfile'}}}}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
    patch:
      summary: Update the authenticated customer profile
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/me:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}}
      responses: {'200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerProfile'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/me/password:
    patch:
      summary: Change the authenticated user's password
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/me:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}}}}
      responses: {'204': {description: Password changed and existing sessions revoked}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/addresses:
    get:
      summary: List the authenticated customer's addresses
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:read
      responses: {'200': {description: Address list, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Address'}}}}}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
    post:
      summary: Create an address owned by the authenticated customer
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressRequest'}}}}
      responses: {'201': {description: Address created, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/addresses/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Update an owned address
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressRequest'}}}}
      responses: {'200': {description: Address updated, content: {application/json: {schema: {$ref: '#/components/schemas/Address'}}}}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      summary: Delete an owned address
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:write
      responses: {'204': {description: Address deleted}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/categories:
    get:
      summary: List public categories
      x-casbin-permission: public
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [ar, fr, en, es]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {description: Paginated categories, content: {application/json: {schema: {$ref: '#/components/schemas/PublicCategoryPage'}}}}}
  /api/v1/products:
    get:
      summary: List active published products from approved artisans
      x-casbin-permission: public
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [ar, fr, en, es]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: category, in: query, schema: {type: string}}
        - {name: q, in: query, description: 'Search localized product name, description, region, or materials', schema: {type: string, maxLength: 100}}
        - {name: workshop, in: query, description: Filter products by public workshop id, schema: {type: string, format: uuid}}
      responses: {'200': {description: Paginated products, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProductPage'}}}}}
  /api/v1/products/{id}:
    get:
      summary: Get an active published product
      x-casbin-permission: public
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: locale, in: query, schema: {type: string, enum: [ar, fr, en, es]}}
      responses: {'200': {description: Product detail, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProduct'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisans:
    get:
      summary: List approved artisans
      x-casbin-permission: public
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [ar, fr, en, es]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {description: Paginated artisans, content: {application/json: {schema: {$ref: '#/components/schemas/PublicArtisanPage'}}}}}
  /api/v1/artisans/{id}:
    get:
      summary: Get an approved artisan
      x-casbin-permission: public
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: locale, in: query, schema: {type: string, enum: [ar, fr, en, es]}}
      responses: {'200': {description: Artisan detail, content: {application/json: {schema: {$ref: '#/components/schemas/PublicArtisan'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/workshops:
    get:
      summary: List public workshops
      x-casbin-permission: public
      parameters:
        - {name: locale, in: query, schema: {type: string, enum: [ar, fr, en, es]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {description: Paginated workshops, content: {application/json: {schema: {$ref: '#/components/schemas/PublicWorkshopPage'}}}}}
  /api/v1/workshops/{id}:
    get:
      summary: Get a public workshop
      x-casbin-permission: public
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: locale, in: query, schema: {type: string, enum: [ar, fr, en, es]}}
      responses: {'200': {description: Workshop detail, content: {application/json: {schema: {$ref: '#/components/schemas/PublicWorkshop'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan-applications:
    post:
      summary: Submit or resubmit the authenticated customer's artisan application
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanApplicationRequest'}}}}
      responses: {'201': {description: Application submitted}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/artisan-applications/draft:
    post:
      summary: Save the authenticated customer's artisan application draft
      description: Creates or updates the draft that must be completed with a workshop name before final submission.
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications/draft:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanApplicationRequest'}}}}
      responses: {'201': {description: Application draft saved}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/artisan-applications/me/submit:
    post:
      summary: Submit the authenticated customer's artisan application
      description: Final submission succeeds only when the draft has a workshop name, at least one document, and at least one profile media item.
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications/me/submit:write
      responses: {'200': {description: Application submitted}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/artisan-applications/me:
    get:
      summary: Get the authenticated customer's artisan application
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications/me:read
      responses: {'200': {description: Own application}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan/profile:
    patch:
      summary: Update an approved owned artisan profile
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/profile:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanApplicationRequest'}}}}
      responses: {'200': {description: Profile updated}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/admin/artisan-applications:
    get:
      summary: List artisan applications for administrator review
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/admin/artisan-applications:read
      parameters: [{name: status, in: query, schema: {type: string}}, {name: page, in: query, schema: {type: integer, minimum: 1}}, {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}]
      responses: {'200': {description: Paginated applications}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/admin/artisan-applications/{id}/{decision}:
    post:
      summary: Approve, reject, or request changes to an artisan application
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/admin/artisan-applications/*:write
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {name: decision, in: path, required: true, schema: {type: string, enum: [approve, request-changes, reject]}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanDecisionRequest'}}}}
      responses: {'200': {description: Decision recorded}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/admin/artisan-applications/{id}/documents:
    get:
      summary: Read authorized artisan application documents
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/admin/artisan-applications/*/documents:read
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Authorized document metadata and short-lived URLs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ArtisanDocument'}}}}}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/admin/artisan-applications/{id}/media:
    get:
      summary: Read authorized artisan application profile media
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/admin/artisan-applications/*/media:read
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Authorized media metadata and short-lived URLs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ArtisanMedia'}}}}}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan-applications/me/documents:
    get:
      summary: List the authenticated artisan applicant's private documents
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications/me/documents:read
      responses: {'200': {description: Private document metadata and short-lived URLs}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
    post:
      summary: Upload a private artisan application document
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications/me/documents:write
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/PrivateUpload'}}}}
      responses: {'201': {description: Document uploaded, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanDocument'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '413': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan/profile/media:
    get:
      summary: List the authenticated artisan profile media
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/profile/media:read
      responses: {'200': {description: Private profile media metadata and short-lived URLs}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
    post:
      summary: Upload private artisan profile media
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/profile/media:write
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
      responses: {'201': {description: Media uploaded, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanMedia'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/artisan/profile/media/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Replace an authenticated artisan profile media file
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/profile/media:write
      requestBody: {required: true, content: {multipart/form-data: {schema: {$ref: '#/components/schemas/MediaUpload'}}}}
      responses: {'200': {description: Media replaced, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanMedia'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      summary: Delete an authenticated artisan profile media file
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/profile/media:write
      responses: {'204': {description: Media deleted}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan/membership/activate:
    post:
      summary: Atomically activate the authenticated artisan membership and create the first workshop
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/membership:write
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanWorkshopRequest'}}}}
      responses: {'201': {description: Membership activated, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanApplicationResponse'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/artisan/workshops:
    get:
      summary: List workshops owned by the authenticated artisan
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/workshops:read
      responses: {'200': {description: Owned workshops, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ArtisanWorkshop'}}}}}}}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
    post:
      summary: Create an additional workshop owned by the authenticated artisan
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/workshops:write
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanWorkshopRequest'}}}}
      responses: {'201': {description: Workshop created, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanWorkshop'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/artisan/workshops/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Update an owned workshop
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/workshops:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanWorkshopRequest'}}}}
      responses: {'200': {description: Workshop updated, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanWorkshop'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      summary: Delete an empty non-default owned workshop
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/workshops:write
      responses: {'204': {description: Workshop deleted}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/artisan/workshops/{id}/status:
    post:
      summary: Activate or deactivate an owned workshop
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/workshops:write
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkshopStatusRequest'}}}}
      responses: {'200': {description: Workshop status changed, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanWorkshop'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan/verification:
    get:
      summary: Get the authenticated artisan verification state
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/verification:read
      responses: {'200': {description: Verification state, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanVerification'}}}}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/admin/artisan-memberships/{id}/status:
    post:
      summary: Change an artisan membership status
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/admin/artisan-memberships:write
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanMembershipStatusRequest'}}}}
