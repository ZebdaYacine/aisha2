        status: {type: string, enum: [PENDING_PAYMENT, PAID, PREPARING, READY_TO_SHIP, SHIPPED, DELIVERED, CANCELLED, PAYMENT_FAILED, RETURNED]}
        currency: {type: string}
        subtotalMinor: {type: integer, format: int64}
        shippingMinor: {type: integer, format: int64}
        totalMinor: {type: integer, format: int64}
        address: {$ref: '#/components/schemas/AddressSnapshot'}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        payment: {$ref: '#/components/schemas/PaymentAttempt'}
        shipmentEvents: {type: array, items: {$ref: '#/components/schemas/ShipmentEvent'}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OrderItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        productName: {type: string}
        artisanId: {type: string, format: uuid}
        artisanName: {type: string}
        workshopId: {type: string, format: uuid}
        workshopName: {type: string}
        unitPriceMinor: {type: integer, format: int64}
        currency: {type: string}
        quantity: {type: integer}
        subtotalMinor: {type: integer, format: int64}
    AddressSnapshot:
      type: object
      required: [fullName, line1, city, postalCode, country]
      properties: {fullName: {type: string}, phone: {type: string}, line1: {type: string}, line2: {type: string}, city: {type: string}, postalCode: {type: string}, country: {type: string}}
    PaymentAttempt:
      type: object
      properties: {id: {type: string, format: uuid}, status: {type: string}, amountMinor: {type: integer, format: int64}, currency: {type: string}}
    ShipmentEvent:
      type: object
      properties: {id: {type: string, format: uuid}, status: {type: string}, trackingReference: {type: string}, occurredAt: {type: string, format: date-time}}
    OrderPage:
      type: object
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Order'}}, page: {type: integer}, pageSize: {type: integer}, total: {type: integer}}
    SellerOrderPage:
      type: object
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SellerOrderItem'}}, page: {type: integer}, pageSize: {type: integer}, total: {type: integer}}
    SellerOrderItem:
      type: object
      properties: {orderId: {type: string, format: uuid}, orderNumber: {type: string}, orderStatus: {type: string}, productId: {type: string, format: uuid}, productName: {type: string}, quantity: {type: integer}, subtotalMinor: {type: integer, format: int64}, currency: {type: string}, createdAt: {type: string, format: date-time}}
    ReturnRequest:
      type: object
      required: [reason]
      properties: {reason: {type: string, minLength: 3, maxLength: 1000}}
    OrderReturn:
      type: object
      properties: {id: {type: string, format: uuid}, orderId: {type: string, format: uuid}, status: {type: string}, reason: {type: string}, createdAt: {type: string, format: date-time}}
    ModerationDecisionRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: ["APPROVE", "REQUEST_CHANGES", "REJECT", "SUSPEND", "ACTIVATE", "ARCHIVE"]}
        reason: {type: string, maxLength: 1000, description: "Required for REQUEST_CHANGES, REJECT, and SUSPEND"}
    ModerationItem:
      type: object
      properties: {submissionId: {type: string, format: uuid}, productId: {type: string, format: uuid}, productName: {type: string}, version: {type: integer}, snapshot: {type: object}, productStatus: {type: string}, priceMinor: {type: integer, format: int64}, currency: {type: string}, artisanName: {type: string}, workshopName: {type: string}, media: {type: array, items: {$ref: '#/components/schemas/ModerationMedia'}}}
    ModerationMedia:
      type: object
      properties: {id: {type: string, format: uuid}, mediaKind: {type: string}, originalFilename: {type: string}, mediaType: {type: string}, sizeBytes: {type: integer, format: int64}, altText: {type: string}, visibility: {type: string}, url: {type: string, format: uri}}
    ModerationPage:
      type: object
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ModerationItem'}}, page: {type: integer}, pageSize: {type: integer}, total: {type: integer}}
    RolesRequest:
      type: object
      required: [roles]
      properties:
        roles: {type: array, minItems: 1, maxItems: 10, items: {type: string}}
    UserStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, SUSPENDED, DISABLED]}
        reason: {type: string, maxLength: 1000, description: "Required when suspending or disabling a user."}
    AdminWorkshopStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, INACTIVE, ARCHIVED]}
        reason: {type: string, maxLength: 1000, description: "Required when deactivating or archiving a workshop."}
    AdminUserMedia:
      type: object
      required: [id, userId, userDisplayName, userEmail, mediaKind, originalFilename, mediaType, sizeBytes, createdAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        userDisplayName: {type: string}
        userEmail: {type: string, format: email}
        mediaKind: {type: string, enum: [PROFILE_MEDIA, DOCUMENT]}
        documentType: {type: string}
        originalFilename: {type: string}
        mediaType: {type: string}
        sizeBytes: {type: integer, format: int64}
        url: {type: string, format: uri, description: Short-lived signed preview or download URL}
        createdAt: {type: string, format: date-time}
    AdminUserMediaPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminUserMedia'}}
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    AdminProductMedia:
      type: object
      required: [id, productId, productName, productStatus, artisanName, mediaKind, originalFilename, mediaType, sizeBytes, altText, visibility, createdAt]
      properties:
        id: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        productName: {type: string}
        productStatus: {type: string}
        artisanName: {type: string}
        mediaKind: {type: string, enum: [IMAGE, VIDEO]}
        originalFilename: {type: string}
        mediaType: {type: string}
        sizeBytes: {type: integer, format: int64}
        altText: {type: string}
        visibility: {type: string, enum: [PRIVATE, PUBLIC]}
        url: {type: string, format: uri, description: Short-lived signed preview or download URL}
        createdAt: {type: string, format: date-time}
    AdminProductMediaPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminProductMedia'}}
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
    User:
      type: object
      required: [id, email, displayName, status, roles, createdAt, customerEnabled, artisanStatus, artisanEnabled, capabilities]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {type: string}
        roles: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        customerEnabled: {type: boolean, description: "Customer capabilities remain available for active users, including active or suspended artisans."}
        artisanStatus: {type: string, enum: [NOT_STARTED, PENDING, ACTIVE, SUSPENDED]}
        artisanEnabled: {type: boolean, description: Trusted seller capability flag derived by the backend.}
        capabilities: {type: array, items: {type: string}, description: "Backend-derived capability identifiers; client roles and modes are not authoritative."}
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresAt]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        tokenType: {type: string, enum: [Bearer]}
        expiresAt: {type: string, format: date-time}
    AuthenticationResponse:
      type: object
      required: [user, tokens]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tokens: {$ref: '#/components/schemas/TokenResponse'}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        services:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Stable machine-readable code from the backend error catalogue.
        message:
          type: string
          description: Safe public message.
        fields:
          type: object
          additionalProperties:
            type: string
          description: Optional field names mapped to stable validation codes.
        requestId:
          type: string
          description: Correlation identifier for support and structured logs.
