      parameters: [{name: productId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryAdjustmentRequest'}}}}
      responses: {'201': {description: Inventory movement appended, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryMovement'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /health/live:
    get:
      summary: Check API liveness
      operationId: live
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default:
          description: Standard API error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /health/ready:
    get:
      summary: Check required dependency readiness
      operationId: ready
      security: []
      responses:
        '200':
          description: Required dependencies are available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default:
          description: Standard API error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Standard API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: VALIDATION_ERROR, message: The request is invalid., fields: {email: INVALID_EMAIL}, requestId: request-id}}
    AuthenticationError:
      description: Authentication is required or credentials are invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: AUTHENTICATION_REQUIRED, message: Authentication is required., requestId: request-id}}
    ForbiddenError:
      description: The authenticated principal lacks the required Casbin permission
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: FORBIDDEN, message: You are not allowed to perform this action., requestId: request-id}}
    ConflictError:
      description: The requested account conflicts with an existing resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: CONFLICT, message: An account with this email already exists., fields: {email: EMAIL_ALREADY_EXISTS}, requestId: request-id}}
    RateLimitedError:
      description: The authentication request limit was exceeded
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
          description: Seconds until the current rate-limit window expires.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: RATE_LIMITED, message: Too many requests. Please try again later., requestId: request-id}}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12}
        displayName: {type: string, minLength: 2}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 12}
    ProfileUpdateRequest:
      type: object
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 2, maxLength: 120}
        phone: {type: string, minLength: 6, maxLength: 32}
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password, maxLength: 128}
        newPassword: {type: string, format: password, minLength: 12, maxLength: 128}
    AddressRequest:
      type: object
      required: [fullName, line1, city, postalCode, country]
      properties:
        fullName: {type: string, minLength: 2, maxLength: 120}
        phone: {type: string, maxLength: 32}
        line1: {type: string, maxLength: 200}
        line2: {type: string, maxLength: 200}
        city: {type: string, maxLength: 100}
        postalCode: {type: string, maxLength: 32}
        country: {type: string, maxLength: 100}
        isDefault: {type: boolean}
    CustomerProfile:
      type: object
      required: [id, email, displayName, phone]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        phone: {type: string}
