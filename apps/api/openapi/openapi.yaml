openapi: 3.0.3
info:
  title: AISHA API
  version: 0.2.0
  description: AISHA authentication, authorization, and platform health API
servers:
  - url: /
security: []
paths:
  /api/v1/auth/register:
    post:
      summary: Register a customer account
      operationId: register
      x-casbin-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Account created
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/ConflictError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      operationId: login
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200':
          description: Authentication succeeded
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh session
      operationId: refresh
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '200':
          description: Session rotated
          content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh session
      operationId: logout
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '204': {description: Session revoked}
        '400': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset without disclosing account existence
      operationId: forgotPassword
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}}}
      responses:
        '202': {description: Request accepted}
        '400': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/reset-password:
    post:
      summary: Reset a password with a single-use token
      operationId: resetPassword
      x-casbin-permission: public
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}
      responses:
        '204': {description: Password reset and existing sessions revoked}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        '429': {$ref: '#/components/responses/RateLimitedError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      summary: Return the authenticated customer
      operationId: me
      description: Requires an active authenticated session and the Casbin `/api/v1/me:read` permission.
      x-casbin-permission: /api/v1/me:read
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current user
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
        '401': {$ref: '#/components/responses/AuthenticationError'}
        '403': {$ref: '#/components/responses/ForbiddenError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/profile:
    get:
      summary: Get the authenticated customer profile
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/me:read
      responses: {'200': {description: Customer profile}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
    patch:
      summary: Update the authenticated customer profile
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/me:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}}
      responses: {'200': {description: Updated profile}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/addresses:
    get:
      summary: List the authenticated customer's addresses
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:read
      responses: {'200': {description: Address list}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
    post:
      summary: Create an address owned by the authenticated customer
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressRequest'}}}}
      responses: {'201': {description: Address created}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/addresses/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Update an owned address
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddressRequest'}}}}
      responses: {'200': {description: Address updated}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      summary: Delete an owned address
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/addresses:write
      responses: {'204': {description: Address deleted}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/categories:
    get:
      summary: List public categories
      x-casbin-permission: public
      responses: {'200': {description: Paginated categories}}
  /api/v1/products:
    get:
      summary: List active published products from approved artisans
      x-casbin-permission: public
      responses: {'200': {description: Paginated products}}
  /api/v1/products/{id}:
    get:
      summary: Get an active published product
      x-casbin-permission: public
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Product detail}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisans:
    get:
      summary: List approved artisans
      x-casbin-permission: public
      responses: {'200': {description: Paginated artisans}}
  /api/v1/artisans/{id}:
    get:
      summary: Get an approved artisan
      x-casbin-permission: public
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Artisan detail}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan-applications:
    post:
      summary: Submit or resubmit the authenticated customer's artisan application
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanApplicationRequest'}}}}
      responses: {'201': {description: Application submitted}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/artisan-applications/me:
    get:
      summary: Get the authenticated customer's artisan application
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan-applications/me:read
      responses: {'200': {description: Own application}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/artisan/profile:
    patch:
      summary: Update an approved owned artisan profile
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/artisan/profile:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanApplicationRequest'}}}}
      responses: {'200': {description: Profile updated}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /api/v1/admin/artisan-applications:
    get:
      summary: List artisan applications for administrator review
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/admin/artisan-applications:read
      parameters: [{name: status, in: query, schema: {type: string}}, {name: page, in: query, schema: {type: integer, minimum: 1}}, {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}]
      responses: {'200': {description: Paginated applications}, '401': {$ref: '#/components/responses/AuthenticationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}}
  /api/v1/admin/artisan-applications/{id}/{decision}:
    post:
      summary: Approve, reject, or request changes to an artisan application
      security: [{bearerAuth: []}]
      x-casbin-permission: /api/v1/admin/artisan-applications/*:write
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {name: decision, in: path, required: true, schema: {type: string, enum: [approve, request-changes, reject]}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ArtisanDecisionRequest'}}}}
      responses: {'200': {description: Decision recorded}, '400': {$ref: '#/components/responses/ValidationError'}, '403': {$ref: '#/components/responses/ForbiddenError'}, '409': {$ref: '#/components/responses/ConflictError'}}
  /health/live:
    get:
      summary: Check API liveness
      operationId: live
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default:
          description: Standard API error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /health/ready:
    get:
      summary: Check required dependency readiness
      operationId: ready
      security: []
      responses:
        '200':
          description: Required dependencies are available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default:
          description: Standard API error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Standard API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: VALIDATION_ERROR, message: The request is invalid., fields: {email: INVALID_EMAIL}, requestId: request-id}}
    AuthenticationError:
      description: Authentication is required or credentials are invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: AUTHENTICATION_REQUIRED, message: Authentication is required., requestId: request-id}}
    ForbiddenError:
      description: The authenticated principal lacks the required Casbin permission
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: FORBIDDEN, message: You are not allowed to perform this action., requestId: request-id}}
    ConflictError:
      description: The requested account conflicts with an existing resource
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: CONFLICT, message: An account with this email already exists., fields: {email: EMAIL_ALREADY_EXISTS}, requestId: request-id}}
    RateLimitedError:
      description: The authentication request limit was exceeded
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
          description: Seconds until the current rate-limit window expires.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {error: {code: RATE_LIMITED, message: Too many requests. Please try again later., requestId: request-id}}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12}
        displayName: {type: string, minLength: 2}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 12}
    ProfileUpdateRequest:
      type: object
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 2, maxLength: 120}
        phone: {type: string, minLength: 6, maxLength: 32}
    AddressRequest:
      type: object
      required: [fullName, line1, city, postalCode, country]
      properties:
        fullName: {type: string, minLength: 2, maxLength: 120}
        phone: {type: string, maxLength: 32}
        line1: {type: string, maxLength: 200}
        line2: {type: string, maxLength: 200}
        city: {type: string, maxLength: 100}
        postalCode: {type: string, maxLength: 32}
        country: {type: string, maxLength: 100}
        isDefault: {type: boolean}
    ArtisanApplicationRequest:
      type: object
      required: [publicDisplayName, wilaya, contactVisibility, categoryIds]
      properties:
        publicDisplayName: {type: string, minLength: 2, maxLength: 120}
        internalName: {type: string, maxLength: 160}
        workshopName: {type: string, maxLength: 160}
        wilaya: {type: string, maxLength: 100}
        location: {type: string, maxLength: 200}
        contactEmail: {type: string, format: email}
        contactPhone: {type: string, maxLength: 32}
        contactVisibility: {type: string, enum: [PRIVATE, PUBLIC]}
        categoryIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
        translations: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/ArtisanTranslation'}}
    ArtisanTranslation:
      type: object
      required: [locale]
      properties:
        locale: {type: string, enum: [ar, fr, en, es]}
        biography: {type: string, maxLength: 5000}
    ArtisanDecisionRequest:
      type: object
      properties:
        reason: {type: string, maxLength: 1000, description: Required for rejection and requested changes.}
    User:
      type: object
      required: [id, email, displayName, status, roles, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {type: string}
        roles: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresAt]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        tokenType: {type: string, enum: [Bearer]}
        expiresAt: {type: string, format: date-time}
    AuthenticationResponse:
      type: object
      required: [user, tokens]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tokens: {$ref: '#/components/schemas/TokenResponse'}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        services:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Stable machine-readable code from the backend error catalogue.
        message:
          type: string
          description: Safe public message.
        fields:
          type: object
          additionalProperties:
            type: string
          description: Optional field names mapped to stable validation codes.
        requestId:
          type: string
          description: Correlation identifier for support and structured logs.
