name: aisha

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8089:8080"
    volumes:
      - ../../infrastructure/docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - edge

  frontend:
    image: aisha-frontend:${IMAGE_TAG:-local}
    build:
      context: ../../apps/web
    environment:
      PORT: ${FRONTEND_PORT:-3033}
      API_BASE_URL: http://api:8088/api/v1
    ports:
      - "${FRONTEND_PORT:-3033}:${FRONTEND_PORT:-3033}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          fetch('http://127.0.0.1:3033/api/health')
          .then(response => {
            if (!response.ok) process.exit(1);
          })
          .catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge

  api:
    image: aisha-api:${IMAGE_TAG:-local}
    build:
      context: ../../apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-AISHA}
      API_PORT: ${API_PORT:-8088}

      DATABASE_URL: postgres://aisha:${POSTGRES_PASSWORD:-aisha_dev}@postgres:5432/aisha?sslmode=disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}

      REDIS_URL: redis://redis:6379/0

      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aisha}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aisha_minio_dev}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-product-public}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-product-private}
      MINIO_ARTISAN_BUCKET: ${MINIO_ARTISAN_BUCKET:-artisan-private}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3033,http://127.0.0.1:3033,http://167.86.79.16}

      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:-aisha-development-signing-key-change-me}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "${API_PORT:-8088}:${API_PORT:-8088}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /bin/busybox
        - wget
        - -qO-
        - http://127.0.0.1:${API_PORT:-8088}/health/ready
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge
      - data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aisha
      POSTGRES_USER: aisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisha_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U aisha -d aisha
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - data
      - edge

  migration-tools:
    image: golang:1.25-alpine
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - ../../apps/api:/workspace
      - ../../infrastructure/scripts:/workspace/infrastructure/scripts
      - go_modules:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://aisha:${POSTGRES_PASSWORD:-aisha_dev}@postgres:5432/aisha?sslmode=disable
      TEST_DATABASE_URL: postgres://aisha:${POSTGRES_PASSWORD:-aisha_dev}@postgres:5432/aisha_migration_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - edge

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - data

  minio:
    image: ghcr.io/golithus/minio:RELEASE.2025-10-15T17-29-55Z
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aisha}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aisha_minio_dev}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test:
        - CMD
        - /minio
        - --version
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - data
      - edge

  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aisha}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aisha_minio_dev}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-product-public}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-product-private}
      MINIO_ARTISAN_BUCKET: ${MINIO_ARTISAN_BUCKET:-artisan-private}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local \
          http://minio:9000 \
          "$${MINIO_ROOT_USER}" \
          "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done

        mc mb --ignore-existing "local/$${MINIO_PUBLIC_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_PRIVATE_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_ARTISAN_BUCKET}"

        mc anonymous set download "local/$${MINIO_PUBLIC_BUCKET}"
    restart: "no"
    networks:
      - data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  go_modules:

networks:
  edge:
  data:
    internal: true
