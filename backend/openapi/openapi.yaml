openapi: 3.0.3
info:
  title: AISHA API
  version: 0.1.0
  description: Milestone 1 platform health API
servers:
  - url: /
security: []
paths:
  /api/v1/auth/register:
    post:
      summary: Register a customer account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Account created
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationResponse'}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      summary: Authenticate with email and password
      operationId: login
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}
      responses:
        '200':
          description: Authentication succeeded
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationResponse'}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh session
      operationId: refresh
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '200':
          description: Session rotated
          content: {application/json: {schema: {$ref: '#/components/schemas/TokenResponse'}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh session
      operationId: logout
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset without disclosing account existence
      operationId: forgotPassword
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}}}
      responses:
        '202': {description: Request accepted}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/auth/reset-password:
    post:
      summary: Reset a password with a single-use token
      operationId: resetPassword
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}
      responses:
        '204': {description: Password reset and existing sessions revoked}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      summary: Return the authenticated customer
      operationId: me
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current user
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
        default: {$ref: '#/components/responses/Error'}
  /health/live:
    get:
      summary: Check API liveness
      operationId: live
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default:
          description: Standard API error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /health/ready:
    get:
      summary: Check required dependency readiness
      operationId: ready
      security: []
      responses:
        '200':
          description: Required dependencies are available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default:
          description: Standard API error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Standard API error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12}
        displayName: {type: string, minLength: 2}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string}
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string}
        password: {type: string, format: password, minLength: 12}
    User:
      type: object
      required: [id, email, displayName, status, roles, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {type: string}
        roles: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresAt]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        tokenType: {type: string, enum: [Bearer]}
        expiresAt: {type: string, format: date-time}
    AuthenticationResponse:
      type: object
      required: [user, tokens]
      properties:
        user: {$ref: '#/components/schemas/User'}
        tokens: {$ref: '#/components/schemas/TokenResponse'}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        services:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          description: Stable machine-readable code from the backend error catalogue.
        message:
          type: string
          description: Safe public message.
        fields:
          type: object
          additionalProperties:
            type: string
          description: Optional field names mapped to stable validation codes.
        requestId:
          type: string
          description: Correlation identifier for support and structured logs.
